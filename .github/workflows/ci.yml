name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          
      # - name: Lint
      #   run: flake8 .
      # 
      # - name: Format check
      #   run: black --check .

      - name: Pytest
        run: PYTHONPATH=. pytest tests/ -v

      - name: Startup Validation
        run: python scheduler/scheduler.py --validate-only
        env:
          INSTAGRAM_ACCESS_TOKEN: "mock_token"
          INSTAGRAM_BUSINESS_ACCOUNT_ID: "mock_id"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "mock_key"
          GOOGLE_SERVICE_ACCOUNT_JSON: "{}"
          SPREADSHEET_ID: "mock_id"
          META_VERIFY_TOKEN: "mock_token"

      - name: Healthcheck (offline)
        run: python scheduler/healthcheck.py --offline
        env:
          INSTAGRAM_ACCESS_TOKEN: "mock_token"
          INSTAGRAM_BUSINESS_ACCOUNT_ID: "mock_id"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "mock_key"
          GOOGLE_SERVICE_ACCOUNT_JSON: "{}"
          SPREADSHEET_ID: "mock_id"

      - name: Scheduler DRY_RUN
        run: python scheduler/scheduler.py --run-today
        env:
          DRY_RUN: "True"
          ENABLE_UPLOAD: "False"
          INSTAGRAM_ACCESS_TOKEN: "mock_token"
          INSTAGRAM_BUSINESS_ACCOUNT_ID: "mock_id"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "mock_key"
          GOOGLE_SERVICE_ACCOUNT_JSON: "{}"
          SPREADSHEET_ID: "mock_id"
          META_VERIFY_TOKEN: "mock_token"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 7
