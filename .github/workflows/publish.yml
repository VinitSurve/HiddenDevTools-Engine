name: Scheduled Instagram Publishing

on:
  schedule:
    # Primary scheduled publishing: 7:00 PM IST (Asia/Kolkata, UTC+05:30) = 13:30 UTC
    # Runs Monday through Saturday (1-6). Sunday is intentionally excluded.
    - cron: '30 13 * * 1-6'
    # Secondary recovery & reconciliation: 8:30 PM IST (15:00 UTC) Monday-Saturday
    # Safely recovers delayed/missed runs; idempotent no-op if already published
    - cron: '0 15 * * 1-6'
    # Late recovery: 11:00 PM IST (17:30 UTC) Monday-Saturday
    - cron: '30 17 * * 1-6'
  workflow_dispatch:
    inputs:
      day:
        description: 'Specific day of week (or "today" to infer from IST)'
        required: false
        default: 'today'
        type: choice
        options:
          - today
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          - sunday
      date:
        description: 'Specific date override (YYYY-MM-DD, optional)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Run in DRY RUN mode (no live Instagram publication)'
        required: false
        default: false
        type: boolean

concurrency:
  group: publishing-engine
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Daily Carousel
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Secrets & Environment Preflight
        run: |
          python -c "
          import os, sys, json

          required_vars = [
              'INSTAGRAM_ACCESS_TOKEN',
              'INSTAGRAM_BUSINESS_ACCOUNT_ID',
              'SUPABASE_URL',
              'SUPABASE_SERVICE_ROLE_KEY',
              'SPREADSHEET_ID'
          ]
          missing = [v for v in required_vars if not os.getenv(v, '').strip()]

          sa_json = os.getenv('GOOGLE_SERVICE_ACCOUNT_JSON', '').strip()
          sa_file = os.getenv('SERVICE_ACCOUNT_FILE', '').strip()
          if not sa_json and not (sa_file and os.path.isfile(sa_file)):
              missing.append('GOOGLE_SERVICE_ACCOUNT_JSON or SERVICE_ACCOUNT_FILE')
          elif sa_json:
              try:
                  parsed = json.loads(sa_json)
                  if 'private_key' not in parsed or 'client_email' not in parsed:
                      missing.append('GOOGLE_SERVICE_ACCOUNT_JSON (missing keys)')
              except Exception:
                  missing.append('GOOGLE_SERVICE_ACCOUNT_JSON (invalid JSON)')

          if missing:
              print(f'::error::Missing or invalid production secrets: {missing}')
              sys.exit(1)
          print('All required production secrets verified successfully.')
          "
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID || secrets.INSTAGRAM_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

      - name: Execute Daily Carousel Publishing Engine
        run: |
          CLI_ARGS="--run-today --schedule-aware"

          SCHEDULED_AT=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SCHEDULED_AT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq '.created_at' 2>/dev/null || echo "")
          fi
          if [ -n "$SCHEDULED_AT" ]; then
            CLI_ARGS="$CLI_ARGS --scheduled-at $SCHEDULED_AT"
          fi

          # Handle manual workflow dispatch overrides safely
          INPUT_DAY="${{ inputs.day }}"
          if [ -n "$INPUT_DAY" ] && [ "$INPUT_DAY" != "today" ]; then
            CLI_ARGS="--run-today --day $INPUT_DAY"
          fi

          INPUT_DATE="${{ inputs.date }}"
          if [ -n "$INPUT_DATE" ]; then
            CLI_ARGS="--run-today --date $INPUT_DATE"
          fi

          echo "Executing scheduler: python scheduler/scheduler.py $CLI_ARGS"
          python scheduler/scheduler.py $CLI_ARGS
        env:
          PERSISTENCE_BACKEND: "supabase"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          ENABLE_PUBLISHING: ${{ inputs.dry_run && 'false' || 'true' }}
          ENABLE_RENDERING: "true"
          ENABLE_UPLOAD: "true"
          ENABLE_COMPLETION: "true"
          ENABLE_RECONCILIATION: "true"
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID || secrets.INSTAGRAM_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN || secrets.META_WEBHOOK_VERIFY_TOKEN }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION || 'v23.0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publishing Summary & Alerting
        if: always()
        run: |
          python -c "
          import json, os, sys

          audit_file = 'scheduler_audit.json'
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')

          if not os.path.isfile(audit_file):
              if summary_file:
                  with open(summary_file, 'a') as f:
                      f.write('## ⚠️ Publishing Run Incomplete\nNo audit log was produced.\n')
              sys.exit(0)

          with open(audit_file) as f:
              lines = [l.strip() for l in f if l.strip()]

          if not lines:
              sys.exit(0)

          last_audit = json.loads(lines[-1])
          status = last_audit.get('status', 'UNKNOWN')
          skip_reason = last_audit.get('skip_reason')
          intended_date = last_audit.get('intended_date', last_audit.get('timestamp', ''))
          niche = last_audit.get('niche', 'N/A')
          media_id = last_audit.get('media_id', 'N/A')
          permalink = last_audit.get('permalink', '')
          delay_human = last_audit.get('delay_human', '0s')

          md = []
          if status == 'SUCCESS':
              if skip_reason == 'ALREADY_PUBLISHED':
                  md.append('## ✅ Scheduled Post Already Published (Idempotent Skip)')
                  md.append(f'- **Target Date**: \`{intended_date}\` ({niche})')
                  md.append(f'- **Instagram Media ID**: \`{media_id}\`')
                  if permalink:
                      md.append(f'- **Instagram Post**: [{permalink}]({permalink})')
                  md.append(f'- **Execution Delay**: {delay_human}')
              else:
                  md.append('## 🚀 Instagram Carousel Published Successfully')
                  md.append(f'- **Target Date**: \`{intended_date}\` ({niche})')
                  md.append(f'- **Instagram Media ID**: \`{media_id}\`')
                  if permalink:
                      md.append(f'- **Instagram Post**: [{permalink}]({permalink})')
                  md.append(f'- **Batch ID**: \`{last_audit.get(\"batch_id\", \"\")}\`')
                  md.append(f'- **Execution Delay**: {delay_human}')
          elif status == 'SKIPPED':
              md.append('## ℹ️ Publishing Intentionally Skipped')
              md.append('- **Reason**: Sunday scheduled publishing is disabled')
          elif status == 'EXPIRED':
              md.append('## ⚠️ Scheduled Publishing Slot Expired')
              md.append(f'- **Target Date**: \`{intended_date}\` ({niche})')
              md.append(f'- **Execution Delay**: {delay_human}')
              md.append('- **Reason**: Run was dropped because execution started after the 24-hour publishing window closed, preventing stale publishing or colliding with the next scheduled day.')
          else:
              md.append('## ❌ Publishing Failed or Incomplete')
              md.append(f'- **Target Date**: \`{intended_date}\` ({niche})')
              md.append(f'- **Status**: \`{status}\`')
              print('::error::Instagram publishing pipeline failed or did not complete successfully!')


          if summary_file:
              with open(summary_file, 'a') as f:
                  f.write('\n'.join(md) + '\n')
          "

      - name: Upload Audit Logs & Manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publishing-run-artifacts-${{ github.run_id }}
          path: |
            scheduler_audit.json
            output/**/manifest.json
            output/**/scheduler_audit.json
          retention-days: 14
