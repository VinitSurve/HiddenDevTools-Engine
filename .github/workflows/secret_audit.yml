name: Secret Parity Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit Secrets
        env:
          # Actual GitHub Secrets
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}

          # Expected Fingerprints from Local
          EXPECTED_INSTAGRAM_ACCESS_TOKEN_SHA256: ${{ secrets.AUDIT_EXPECTED_INSTAGRAM_ACCESS_TOKEN_SHA256 }}
          EXPECTED_INSTAGRAM_ACCOUNT_ID_SHA256: ${{ secrets.AUDIT_EXPECTED_INSTAGRAM_ACCOUNT_ID_SHA256 }}
          EXPECTED_SUPABASE_URL_SHA256: ${{ secrets.AUDIT_EXPECTED_SUPABASE_URL_SHA256 }}
          EXPECTED_SUPABASE_KEY_SHA256: ${{ secrets.AUDIT_EXPECTED_SUPABASE_KEY_SHA256 }}
          EXPECTED_SPREADSHEET_ID_SHA256: ${{ secrets.AUDIT_EXPECTED_SPREADSHEET_ID_SHA256 }}
          EXPECTED_META_WEBHOOK_VERIFY_TOKEN_SHA256: ${{ secrets.AUDIT_EXPECTED_META_WEBHOOK_VERIFY_TOKEN_SHA256 }}
          EXPECTED_FACEBOOK_PAGE_ID_SHA256: ${{ secrets.AUDIT_EXPECTED_FACEBOOK_PAGE_ID_SHA256 }}
          EXPECTED_META_APP_SECRET_SHA256: ${{ secrets.AUDIT_EXPECTED_META_APP_SECRET_SHA256 }}
          
          EXPECTED_SA_PROJECT_ID: ${{ secrets.AUDIT_EXPECTED_SA_PROJECT_ID }}
          EXPECTED_SA_CLIENT_EMAIL: ${{ secrets.AUDIT_EXPECTED_SA_CLIENT_EMAIL }}
          EXPECTED_SA_KEY_ID: ${{ secrets.AUDIT_EXPECTED_SA_KEY_ID }}
          EXPECTED_SA_JSON_SHA256: ${{ secrets.AUDIT_EXPECTED_SA_JSON_SHA256 }}

        run: |
          python -c "
          import os, hashlib, json
          
          def check(name, val, expected_hash):
              if not val:
                  print(f'{name}: MISSING')
                  return
              if not expected_hash:
                  print(f'{name}: UNVERIFIED (Expected hash not provided)')
                  return
                  
              actual_hash = hashlib.sha256(val.strip().encode('utf-8')).hexdigest()[:12]
              if actual_hash == expected_hash:
                  print(f'{name}: MATCH')
              else:
                  print(f'{name}: MISMATCH')

          print('--- Secret Parity Audit ---')
          check('INSTAGRAM_ACCESS_TOKEN', os.getenv('INSTAGRAM_ACCESS_TOKEN'), os.getenv('EXPECTED_INSTAGRAM_ACCESS_TOKEN_SHA256'))
          check('INSTAGRAM_ACCOUNT_ID', os.getenv('INSTAGRAM_ACCOUNT_ID'), os.getenv('EXPECTED_INSTAGRAM_ACCOUNT_ID_SHA256'))
          check('SUPABASE_URL', os.getenv('SUPABASE_URL'), os.getenv('EXPECTED_SUPABASE_URL_SHA256'))
          check('SUPABASE_KEY', os.getenv('SUPABASE_KEY'), os.getenv('EXPECTED_SUPABASE_KEY_SHA256'))
          check('SPREADSHEET_ID', os.getenv('SPREADSHEET_ID'), os.getenv('EXPECTED_SPREADSHEET_ID_SHA256'))
          check('META_WEBHOOK_VERIFY_TOKEN', os.getenv('META_WEBHOOK_VERIFY_TOKEN'), os.getenv('EXPECTED_META_WEBHOOK_VERIFY_TOKEN_SHA256'))
          check('FACEBOOK_PAGE_ID', os.getenv('FACEBOOK_PAGE_ID'), os.getenv('EXPECTED_FACEBOOK_PAGE_ID_SHA256'))
          check('META_APP_SECRET', os.getenv('META_APP_SECRET'), os.getenv('EXPECTED_META_APP_SECRET_SHA256'))

          print('\n--- Service Account Parity Audit ---')
          sa_json = os.getenv('GOOGLE_SERVICE_ACCOUNT_JSON')
          if not sa_json:
              print('GOOGLE_SERVICE_ACCOUNT_JSON: MISSING')
          else:
              try:
                  sa = json.loads(sa_json)
                  # Project ID
                  pid = sa.get('project_id', '')
                  epid = os.getenv('EXPECTED_SA_PROJECT_ID', '')
                  if not epid:
                      print('SA_PROJECT_ID: UNVERIFIED')
                  elif pid == epid:
                      print('SA_PROJECT_ID: MATCH')
                  else:
                      print('SA_PROJECT_ID: MISMATCH')

                  # Client Email
                  ce = sa.get('client_email', '')
                  ece = os.getenv('EXPECTED_SA_CLIENT_EMAIL', '')
                  if not ece:
                      print('SA_CLIENT_EMAIL: UNVERIFIED')
                  elif ce == ece:
                      print('SA_CLIENT_EMAIL: MATCH')
                  else:
                      print('SA_CLIENT_EMAIL: MISMATCH')

                  # Key ID
                  kid = sa.get('private_key_id', '')
                  ekid = os.getenv('EXPECTED_SA_KEY_ID', '')
                  if not ekid:
                      print('SA_KEY_ID: UNVERIFIED')
                  elif kid == ekid:
                      print('SA_KEY_ID: MATCH')
                  else:
                      print('SA_KEY_ID: MISMATCH')
                      
                  # Exact JSON Hash
                  check('GOOGLE_SERVICE_ACCOUNT_JSON (Exact)', sa_json, os.getenv('EXPECTED_SA_JSON_SHA256'))
                      
              except Exception as e:
                  print(f'GOOGLE_SERVICE_ACCOUNT_JSON: PARSE ERROR - {str(e)}')
          "

      - name: Service-Level Identity Verification (Read-Only)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python -c "
          import os, json
          from config.app_config import config
          from services.instagram_service import InstagramService
          from services.storage_service import StorageService
          from sheet_api import open_sheet

          print('\n--- Read-Only Service Validation ---')

          # 1. Instagram
          try:
              ig = InstagramService()
              print('Instagram: Successfully initialized service.')
              # Just fetching quota is a read-only request that verifies the token and account ID
              quota = ig._fetch_publishing_quota()
              print(f'Instagram: Success! Quota used: {quota}/100')
          except Exception as e:
              print(f'Instagram: FAILED - {str(e)}')

          # 2. Supabase
          try:
              st = StorageService()
              print('Supabase: Successfully initialized service.')
              # Check bucket exists (indirectly via a small list or just catching failure)
              client = st._get_client()
              res = client.storage.from_('posts').list(limit=1)
              print('Supabase: Success! Can list bucket \"posts\".')
          except Exception as e:
              print(f'Supabase: FAILED - {str(e)}')

          # 3. Google Sheets
          try:
              # Service account JSON setup
              sa_json = os.getenv('GOOGLE_SERVICE_ACCOUNT_JSON')
              if sa_json:
                  with open('service_account.json', 'w') as f:
                      f.write(sa_json)
                  
              print('Google Sheets: Authenticating...')
              ws = open_sheet('Developer Tools')
              print(f'Google Sheets: Success! Accessed worksheet rows: {len(ws.get_all_records())}')
          except Exception as e:
              print(f'Google Sheets: FAILED - {str(e)}')
          "
